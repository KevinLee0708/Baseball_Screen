<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sajik Baseball Live Scoreboard</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="scoreboard-wrapper">
    <div class="scoreboard-canvas">

      <!-- ==========================================
           1. LEFT: 원정팀 라인업
           ========================================== -->
      <div class="panel lineup-left">
        <div class="team-header">
          <span class="team-name" id="away-team-name">KIWOOM HEROES</span>
          <span class="header-stat-title">AVG</span>
        </div>
        <ul class="lineup-list" id="away-lineup">
          <!-- JS에서 동적 생성 -->
        </ul>
      </div>

      <!-- ==========================================
           2. CENTER: 현재 타자 정보
           ========================================== -->
      <div class="panel batter-center">
        <div class="player-graphic-card">
          <div class="card-back-num" id="current-batter-num">61</div>
          <div class="card-player-info">
            <span class="card-team" id="current-batter-team">KIWOOM</span>
            <span class="card-pos" id="current-batter-pos">OUTFIELDER</span>
          </div>
        </div>

        <div class="batter-details">
          <div class="batter-title-row">
            <span class="b-number" id="batter-back-num">61</span>
            <span class="b-name" id="batter-name">장재영</span>
          </div>

          <div class="record-group today-record">
            <div class="group-header">오늘의 기록</div>
            <div class="today-text" id="today-record-text">삼진</div>
          </div>

          <div class="record-group season-record">
            <div class="group-header">시즌 기록</div>
            <div class="season-grid" id="season-stats-grid">
              <!-- JS에서 동적 생성 -->
            </div>
          </div>
        </div>
      </div>

      <!-- ==========================================
           3. RIGHT: 홈팀 수비위치 & 투수 정보
           ========================================== -->
      <div class="panel defense-right">
        <div class="home-team-header">
          <span class="team-name" id="home-team-name">LOTTE GIANTS</span>
        </div>

        <div class="defense-section">
          <div class="sub-header">수비 라인업</div>
          <div class="field-container" id="field-defense-container">
            <!-- 수비 위치 표시 (JS 연동 가능) -->
            <span class="f-pos p-cf">황성빈</span>
            <span class="f-pos p-lf">김동혁</span>
            <span class="f-pos p-rf">장두성</span>
            <span class="f-pos p-ss">이호연</span>
            <span class="f-pos p-2b">고승민</span>
            <span class="f-pos p-3b">전민재</span>
            <span class="f-pos p-1b">나승엽</span>
            <span class="f-pos p-p">김원중</span>
            <span class="f-pos p-c">정보근</span>
          </div>
        </div>

        <div class="pitcher-section">
          <div class="sub-header red-header">투수 정보</div>
          <div class="p-main-info">
            <span class="p-num" id="pitcher-num">34</span>
            <span class="p-name" id="pitcher-name">김원중</span>
          </div>
          <div class="p-stats-row" id="pitcher-stats-row1">
            <span>승 <strong>0</strong></span>
            <span>패 <strong>0</strong></span>
            <span>홀 <strong>0</strong></span>
            <span>세 <strong>5</strong></span>
          </div>
          <div class="p-stats-row2" id="pitcher-stats-row2">
            <span>이닝 <strong>9.0</strong></span>
            <span>평균자책점 <strong>1.00</strong></span>
          </div>
        </div>
      </div>

      <!-- ==========================================
           4. MID BAR: 투구/심판/경기시간 상태줄
           ========================================== -->
      <div class="mid-status-bar">
        <div class="pitch-counts" id="pitch-counts">
          <span>T <strong>23</strong></span>
          <span>B <strong>9</strong></span>
          <span>S <strong>14</strong></span>
          <span>K <strong>0</strong></span>
        </div>
        <div class="referees" id="referees-list">
          <span>CH 구명환</span>
          <span>Ⅰ 정은재</span>
          <span>Ⅱ 박기택</span>
          <span>Ⅲ 이계성</span>
        </div>
        <div class="game-time">
          <span>경기시간</span>
          <strong id="game-time-val">02:37</strong>
        </div>
        <div class="bso-small">
          <span class="lbl-t">T</span><span class="val">0</span>
          <span class="lbl-b">B</span><span class="val">0</span>
          <span class="lbl-s">S</span><span class="val">0</span>
          <span class="lbl-o">O</span><span class="val">0</span>
        </div>
      </div>

      <!-- ==========================================
           5. BOTTOM: 이닝 스코어보드 & 주자/BSO
           ========================================== -->
      <div class="bottom-scoreboard">
        <table class="score-table">
          <thead>
            <tr>
              <th class="team-col"></th>
              <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th><th>11</th><th>12</th>
              <th class="stat-col">R</th><th class="stat-col">H</th><th class="stat-col">E</th><th class="stat-col">B</th>
            </tr>
          </thead>
          <tbody id="scoreboard-tbody">
            <!-- JS에서 동적 생성 -->
          </tbody>
        </table>

        <!-- B/S/O 및 베이스/주자 상황 -->
        <div class="bso-and-runners">
          <!-- 공격팀 주자 베이스 그래픽 -->
          <div class="runner-field">
            <div class="b-base b-2" id="base-2">
              <span class="runner-tag" id="runner-2-name">이주형</span>
            </div>
            <div class="b-base b-3" id="base-3">
              <span class="runner-tag" id="runner-3-name"></span>
            </div>
            <div class="b-base b-1" id="base-1">
              <span class="runner-tag" id="runner-1-name"></span>
            </div>
          </div>

          <div class="bso-dots">
            <div class="bso-row" id="bso-balls">
              <span class="bso-lbl">B</span><span class="dot active"></span><span class="dot"></span><span class="dot"></span>
            </div>
            <div class="bso-row" id="bso-strikes">
              <span class="bso-lbl">S</span><span class="dot active"></span><span class="dot active"></span>
            </div>
            <div class="bso-row" id="bso-outs">
              <span class="bso-lbl">O</span><span class="dot active"></span><span class="dot"></span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
